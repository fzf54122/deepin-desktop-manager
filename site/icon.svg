<?xml version="1.0" encoding="UTF-8"?>
<!-- @Time    : 2026/10/19 -->
<!-- @Author  : fzf -->
<!-- @FileName: icon.svg -->
<!-- @Software: deepin-desktop-manager -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 背景:深蓝到蓝紫的圆角方格,deepin 风格 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#2b4bd7"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6ff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- 微弱高光,增加层次 -->
  <ellipse cx="170" cy="120" rx="200" ry="120" fill="#ffffff" opacity="0.08"/>

  <!-- 启动器应用网格:2x2 圆角方块,代表 launcher 中的应用入口 -->
  <g fill="url(#grid)">
    <rect x="120" y="120" width="112" height="112" rx="28"/>
    <rect x="260" y="120" width="112" height="112" rx="28"/>
    <rect x="120" y="260" width="112" height="112" rx="28"/>
  </g>
  <!-- 第四格换成笔,点出「编辑 .desktop 文件」的定位 -->
  <rect x="260" y="260" width="112" height="112" rx="28" fill="#ffd66e"/>
  <g transform="translate(316,316) rotate(45)">
    <rect x="-9" y="-52" width="18" height="78" rx="4" fill="#2b4bd7"/>
    <path d="M -9 26 L 0 52 L 9 26 Z" fill="#1d3aa8"/>
  </g>
</svg>
