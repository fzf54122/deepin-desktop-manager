  </defs>
  <rect x="3" y="3" width="90" height="90" rx="20" fill="url(#bg)"/>
  <g fill="#ffffff">
    <rect x="19" y="19" width="25" height="25" rx="7"/>
    <rect x="52" y="19" width="25" height="25" rx="7"/>
    <rect x="19" y="52" width="25" height="25" rx="7"/>
  </g>
  <rect x="52" y="52" width="25" height="25" rx="7" fill="#ffd66e"/>
  <g transform="translate(64.5,64.5) rotate(45)">
    <rect x="-4.5" y="-13" width="9" height="20" rx="2" fill="#2b4bd7"/>
